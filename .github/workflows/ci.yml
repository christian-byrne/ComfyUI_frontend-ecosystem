name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:quick
      - run: pnpm test

      # Knowledge-base drift check. The synced workspace markdown (ADRs,
      # AXIOMS, CONTEXT, AGENTS, todo, announcements) lives under
      # src/data/knowledge/ and the manifest is regenerated by
      # scripts/build-knowledge-manifest.mjs. Re-running the manifest
      # builder against checked-in markdown must produce a byte-identical
      # manifest — otherwise the cross-ref/backlinks index is stale.
      - name: Verify knowledge manifest consistency
        run: |
          node scripts/build-knowledge-manifest.mjs
          git diff --exit-code src/data/knowledge/manifest.json \
            || (echo "::error::knowledge manifest drift — run 'pnpm sync:knowledge' locally and commit the result" && exit 1)
